<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing Practicum | Vercel Deployment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #0078d4, #00b4ff);
        }

        .card {
            width: min(100%, 520px);
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.8rem, 5vw, 2.4rem);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        #time {
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .btn {
            margin-top: 16px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            color: #0078d4;
            background: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #eaf6ff;
            transform: translateY(-2px);
        }

        .btn:focus-visible {
            outline: 3px solid #003e6b;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>☁️ Static Website Successfully Deployed</h1>

        <p>
            This website is deployed on Vercel and connected to GitHub.
        </p>

        <p id="time" aria-live="off"></p>

        <button class="btn" type="button" onclick="showMessage()">
            Click Me
        </button>
    </main>

    <script>
        function showMessage() {
            alert("I have made changes to this webpage for my Cloud Computing deployment!");
        }

        function updateTime() {
            const now = new Date();
            document.getElementById("time").textContent =
                "Current time: " + now.toLocaleString("en-GB");
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
